name: Dependabot auto-merge

# Dependency bumps should not wait on a human. This queues an auto-merge for them, so they
# land by themselves once CI is green — and only then, because auto-merge waits for the
# required status checks on the default branch.
#
# There is no approving step: this repository requires no reviews, so the bumps are already
# mergeable and only need the button pressed. What keeps a red bump out is the required
# status check. If it is ever removed from the branch protection, remove this workflow too,
# or bumps will merge unverified.
#
# `pull_request_target` is deliberate: on a `pull_request` run from Dependabot the
# GITHUB_TOKEN is read-only, so it could not enable auto-merge. This workflow never checks
# out the pull request, so none of its code ever runs here — the step only calls the API.
on:
  pull_request_target:

permissions:
  actions: write # dispatch the deploy after the merge — see the deploy step below
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # the wait below is bounded by the loop itself; this is the backstop
    timeout-minutes: 25
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Skip bumps GITHUB_TOKEN may not merge
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # GITHUB_TOKEN is a GitHub App token, and an App may only touch
          # .github/workflows/** while holding the `workflows` permission — which a workflow
          # `permissions:` block cannot grant (it is a PAT/App-install scope, not one of the
          # keys Actions accepts). So a bump that edits a workflow file can never be merged
          # from here; `/tidy` merges those with a token that has the scope.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[].filename')
          if grep -q '^\.github/workflows/' <<< "$files"; then
            echo "::notice::#$PR_NUMBER touches .github/workflows/** — GITHUB_TOKEN cannot merge it, left for /tidy"
            echo 'mergeable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'mergeable=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.gate.outputs.mergeable == 'true'
        run: gh pr merge --auto --squash "$PR_URL"

      # An auto-merge enabled by GITHUB_TOKEN pushes the squash commit as github-actions[bot],
      # and GITHUB_TOKEN-triggered events do not create workflow runs — so `push` never fires
      # and main sits undeployed until something else lands. `workflow_dispatch` is one of the
      # two events GITHUB_TOKEN may fire, so wait for the merge and dispatch the deploy.
      # `-R` is not optional: with no checkout in this job, `gh` infers the repository
      # from git and dies with "not a git repository".
      - name: Deploy main once the merge lands
        if: steps.gate.outputs.mergeable == 'true'
        run: |
          for _ in $(seq 60); do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            case "$state" in
              MERGED) gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main; exit 0 ;;
              CLOSED) echo "PR closed without merging — nothing to deploy"; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::$PR_URL still not merged after 15 min — deploy not dispatched"
          exit 1
